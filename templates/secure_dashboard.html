{% extends "base.html" %}
{% block content %}
<h2>Dashboard</h2>
<p>Logged in as: <strong>{{ user.username }}</strong> (Role: {{ user.role }})</p>
<p><a href="{{ url_for('secure.logout') }}">Logout</a></p>

<hr>

<h3>Post a Comment</h3>
<form method="POST" action="{{ url_for('secure.secure_comment') }}">
    <textarea name="comment" placeholder="Write message..." required></textarea><br><br>
    <button type="submit">Submit</button>
</form>

<hr>

<h3>Search</h3>
<form method="GET" action="{{ url_for('secure.secure_search') }}">
    <input name="q" placeholder="Search comments...">
    <button type="submit">Search</button>
</form>

<hr>

<h3>Messages</h3>
{% for c in comments %}
    <p>
        <strong>{{ c.username }}</strong>: <br>
        {{ c.content|safe }}
    </p>
    <hr>
{% endfor %}
{% endblock %}

<div id="welcome-dom"></div>
<script>
    // INSECURE: DOM-based XSS demo
    const params = new URLSearchParams(window.location.search);
    const name = params.get("name");
    if (name) {
        document.getElementById("welcome-dom").innerHTML = "Welcome " + name;
    }
</script>
{% endblock %}
