{% extends "base.html" %}
{% block content %}
<h2>Search</h2>

{% if q %}
    <p>You searched for: {{ q }}</p>   {# escaped #}
{% endif %}

<ul>
    {% for r in rows %}
        <li>{{ r.content }}</li>      {# escaped #}
    {% endfor %}
</ul>

<p><a href="{{ url_for('secure.secure_dashboard') }}">Back to dashboard</a></p>
{% endblock %}
