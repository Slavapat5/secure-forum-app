{% extends "base.html" %}
{% block content %}
<h2>Search Results</h2>
<p>Searching for: "{{ q }}"</p>

<p><a href="{{ url_for('secure.secure_dashboard') }}">Back to dashboard</a></p>

<hr>

{% if rows %}
    {% for r in rows %}
        <p>{{ r.content|safe }}</p>
        <hr>
    {% endfor %}
{% else %}
    <p>No results found.</p>
{% endif %}

{% endblock %}
