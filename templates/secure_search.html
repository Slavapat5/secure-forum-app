{% extends "base.html" %}
{% block content %}
<h2>Search</h2>

{% if q %}
    <p>You searched for: {{ q|safe }}</p>   {# reflected XSS #}
{% endif %}

<ul>
    {% for r in rows %}
        <li>{{ r.content|safe }}</li>      {# stored XSS #}
    {% endfor %}
</ul>

<p><a href="{{ url_for('secure.secure_dashboard') }}">Back to dashboard</a></p>
{% endblock %}
